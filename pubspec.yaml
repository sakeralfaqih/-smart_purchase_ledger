name: hisab_almawrid
description: >-
  تطبيق إدارة فواتير المشتريات، ذاكرة الأسعار، وديون الموردين.
  Offline-First single-user app for Abu Radman Ahmed Abdu Ali.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & DI
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Local database (offline-first)
  drift: ^2.19.1+1
  drift_flutter: ^0.1.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.3
  path: ^1.9.0

  # Document scanning & image processing
  google_mlkit_document_scanner: ^0.2.0
  flutter_image_compress: ^2.2.0
  image_picker: ^1.1.2

  # Vision AI (Gemini)
  google_generative_ai: ^0.4.0
  dio: ^5.4.3

  # Reporting / sharing
  pdf: ^3.10.8
  printing: ^5.12.0
  share_plus: ^9.0.0
  url_launcher: ^6.2.6

  # Security & backup
  local_auth: ^2.2.0
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  http: ^1.2.1

  # Utilities
  intl: ^0.20.3
  collection: ^1.18.0
  connectivity_plus: ^6.0.3
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.19.1
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
 # assets:
   # - assets/fonts/
  #fonts:
